<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>NEST 10 Dashboard</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: Arial, sans-serif; background: #121212; color: #fff; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
    
    /* Touch-Navigationsleiste */
    .nav-bar { display: flex; background: #1e1e1e; height: 65px; border-bottom: 2px solid #333; }
    .nav-btn { flex: 1; border: none; background: transparent; color: #888; font-size: 1.3rem; font-weight: bold; cursor: pointer; transition: 0.2s; -webkit-tap-highlight-color: transparent; }
    .nav-btn.active { color: #fff; background: #2a2a2a; border-bottom: 5px solid #00d2ff; }
    
    /* Tab-Inhalte */
    .tab-content { flex: 1; display: none; width: 100%; height: calc(100vh - 65px); }
    .tab-content.active { display: block; }
    
    iframe { width: 100%; height: 100%; border: none; }
    
    /* Foto-Bereich */
    .photo-container { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; background: #000; }
    .photo-container img { max-width: 100%; max-height: 100%; object-fit: contain; }
  </style>
</head>
<body>

  <!-- Touch Navigation oben -->
  <div class="nav-bar">
    <button class="nav-btn active" onclick="openTab('kalender', this)">📅 Kalender</button>
    <button class="nav-btn" onclick="openTab('fotos', this)">🖼️ Fotos</button>
    <button class="nav-btn" onclick="openTab('website', this)">🌐 Website</button>
  </div>

  <!-- TAB 1: Kalender -->
  <div id="kalender" class="tab-content active">
    <!-- Ersetze die nachfolgende URL mit deinem Google Kalender iFrame Link -->
    <iframe src="https://outlook.live.com/owa/calendar/756e54da-7434-4485-adcd-59775f513615/5412f37d-5e45-4ccd-aaf6-fb23f31a66a1/cid-BEE18CE57A5744AB/calendar.ics"></iframe>
  </div>

  <!-- TAB 2: Fotos -->
  <div id="fotos" class="tab-content">
    <div class="photo-container">
      <img id="slideshow" src="https://picsum.photos/1280/800?random=1" alt="Diashow">
    </div>
  </div>

  <!-- TAB 3: Website -->
  <div id="website" class="tab-content">
    <!-- Hier die gewünschte Webseite eintragen (z. B. Nachrichten oder Wetter) -->
    <iframe src="https://www.tagesschau.de"></iframe>
  </div>

  <script>
    function openTab(tabId, btn) {
      document.querySelectorAll('.tab-content').forEach(tab => tab.classList.remove('active'));
      document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
      
      document.getElementById(tabId).classList.add('active');
      btn.classList.add('active');
    }

    // Foto-Wechsel alle 15 Sekunden (Beispiel für Zufallsbilder; lässt sich anpassen)
    setInterval(() => {
      const img = document.getElementById('slideshow');
      if (img && document.getElementById('fotos').classList.contains('active')) {
        img.src = 'https://picsum.photos/1280/800?random=' + Math.floor(Math.random() * 1000);
      }
    }, 15000);
  </script>
</body>
</html>
